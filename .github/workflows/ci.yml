name: CI

on:
  pull_request:
    branches: [main, staging, development]
  push:
    branches: [main, staging, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (Pint + tests + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ninadough_ci
          POSTGRES_USER: ninadough
          POSTGRES_PASSWORD: ninadough
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ninadough -d ninadough_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ninadough_ci
      DB_USERNAME: ninadough
      DB_PASSWORD: ninadough
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql, pgsql, intl, opcache, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style check)
        run: vendor/bin/pint --test

      - name: Run migrations against a clean database
        run: php artisan migrate:fresh --force

      - name: Run test suite
        run: php artisan test

      - name: Create concurrency test database
        run: PGPASSWORD=ninadough psql -h 127.0.0.1 -U ninadough -d ninadough_ci -c "CREATE DATABASE ninadough_concurrency_ci"

      - name: Run capacity-lock concurrency test (real Postgres, forked processes)
        env:
          DB_DATABASE: ninadough_concurrency_ci
        run: vendor/bin/phpunit -c phpunit.concurrency.xml
