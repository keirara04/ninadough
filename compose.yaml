services:
  postgres:
    image: postgres:16-alpine
    container_name: ninadough-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ninadough}
      POSTGRES_USER: ${POSTGRES_USER:-ninadough}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
    ports:
      - "5432:5432"
    volumes:
      - ninadough_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninadough -d ninadough"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ninadough_pgdata: